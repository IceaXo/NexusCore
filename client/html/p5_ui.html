<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NexusCore — Void Gazer</title>
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/cards.css">
</head>
<body>

<!-- Background System -->
<div class="bg-red-zone"></div>
<div class="bg-black-strip"></div>
<div class="bg-halftone"></div>
<div class="bg-watermark p5-font">VOID<br>GAZER</div>

<!-- ============================================================
     LAYER 1: LOBBY — 大厅
     ============================================================ -->
<div id="screen-lobby" class="screen-layer">
  <div class="lobby-buttons">
    <button class="btn-lobby" id="btn-single" onclick="P5.showSingleHint()">
      <span class="btn-lobby-text p5-font">单机模式</span>
    </button>
    <span id="single-hint" class="single-hint p5-font">敬请期待</span>
    <button class="btn-lobby" id="btn-online" onclick="P5.enterRoomList()">
      <span class="btn-lobby-text p5-font">联机模式</span>
    </button>
  </div>

  <!-- 改名弹窗 -->
  <div class="modal-overlay active" id="name-modal">
    <div class="modal-box">
      <div class="modal-title p5-font">ENTER YOUR NAME</div>
      <input id="input-name" class="modal-input p5-font" maxlength="12" placeholder="YOUR NAME" autocomplete="off">
      <div class="avatar-grid" id="avatar-grid"></div>
      <button class="btn-modal-confirm p5-font" onclick="P5.confirmName()">CONFIRM</button>
    </div>
  </div>
</div>

<!-- ============================================================
     LAYER 2: ROOM — 房间
     ============================================================ -->
<div id="screen-room" class="screen-layer" style="display:none;">
  <!-- 房间列表视图 -->
  <div id="room-list-view">
    <div class="room-list-title p5-font">SELECT ROOM</div>
    <div class="room-grid" id="room-grid"></div>
    <button class="btn-back p5-font" onclick="P5.backToLobby()">← BACK</button>
  </div>
  <!-- 房间内视图 -->
  <div id="room-inside-view" style="display:none;">
    <div class="room-inside-title p5-font" id="room-title">ROOM X</div>
    <div class="round-selector" id="round-selector-wrap" style="display:none;">
      <span class="p5-font">ROUNDS:</span>
      <select id="round-select" class="p5-font" onchange="P5.setRounds(this.value)">
        <option value="1">1</option>
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="7">7</option>
        <option value="10">10</option>
      </select>
    </div>
    <div class="room-seats" id="room-seats"></div>
    <div class="room-controls">
      <button class="btn-ready p5-font" id="btn-ready" onclick="P5.toggleReady()">READY</button>
      <button class="btn-leave p5-font" onclick="P5.leaveRoom()">LEAVE</button>
    </div>
  </div>
</div>

<!-- ============================================================
     LAYER 3: GAME — 游戏（现有内容）
     ============================================================ -->
<div id="screen-game" class="screen-layer" style="display:none;">

  <!-- Top Panels -->
  <div class="panel-multiplier p5-font">
    <div class="label">Session Multiplier</div>
    <div class="value" id="multiplier-value">X 512</div>
  </div>

  <div class="panel-phase p5-font">
    <div class="phase-text" id="phase-text">ENGAGED!!</div>
  </div>

  <!-- Player Avatars -->
  <div id="player-nodes"></div>

  <!-- Center played cards -->
  <div class="center-played" id="center-played"></div>

  <!-- Hand Cards -->
  <div class="hand-container" id="hand-container"></div>

  <!-- Bidding Overlay -->
  <div class="bidding-overlay" id="bidding-overlay">
    <div class="bidding-label p5-font" id="bidding-label">CALL THE SHOT</div>
    <div class="bidding-buttons" id="bidding-buttons">
      <button class="btn-bid btn-call" onclick="P5.bidCall()">
        <div class="btn-bg"></div>
        <span class="btn-text p5-font">CALL</span>
      </button>
      <button class="btn-bid btn-bidpass" onclick="P5.bidPass()">
        <div class="btn-bg"></div>
        <span class="btn-text p5-font">PASS</span>
      </button>
    </div>
  </div>

  <!-- BOTTOM_PICK area -->
  <div class="bottom-pick-area" id="bottom-pick-area" style="display:none;">
    <div class="bottom-pick-title p5-font">PICK 2 CARDS</div>
    <div class="bottom-pick-cards" id="bottom-pick-cards"></div>
    <button class="btn-pick-confirm p5-font" id="btn-confirm-pick" onclick="P5.confirmBottomPick()">
      CONFIRM PICK
    </button>
  </div>

  <!-- Top mini bottom cards bar -->
  <div class="bottom-mini-bar" id="bottom-mini-bar" style="display:none;">
    <div class="mini-owner" id="mini-owner-a">
      <div class="mini-cards" id="mini-cards-a"></div>
      <span class="mini-label p5-font" id="mini-label-a"></span>
    </div>
    <div class="mini-owner" id="mini-owner-b">
      <div class="mini-cards" id="mini-cards-b"></div>
      <span class="mini-label p5-font" id="mini-label-b"></span>
    </div>
  </div>

  <!-- Waiting indicator -->
  <div class="waiting-indicator p5-font" id="waiting-indicator" style="display:none;">WAITING...</div>

  <!-- Action Buttons -->
  <div class="action-bar" id="action-bar">
    <button class="btn-action btn-pass" onclick="P5.pass()">
      <div class="btn-bg"></div>
      <span class="btn-text p5-font">PASS</span>
    </button>
    <button class="btn-action btn-hint" onclick="P5.hint()">
      <div class="btn-bg"></div>
      <span class="btn-text p5-font">HINT</span>
    </button>
    <button class="btn-action btn-strike" onclick="P5.play()">
      <div class="btn-bg"></div>
      <span class="btn-text p5-font">STRIKE!!</span>
    </button>
  </div>

  <!-- Scanlines -->
  <div class="scanlines"></div>

  <!-- Result Overlay -->
  <div class="result-overlay" id="result-overlay">
    <div class="result-title p5-font" id="result-title">VICTORY</div>
    <div class="result-sub p5-font" id="result-sub">PRESS ANY KEY TO CONTINUE</div>
    <div class="result-scores" id="result-scores"></div>
    <button class="btn-continue p5-font" id="btn-continue" onclick="P5.clickContinue()">CONTINUE</button>
  </div>

</div>

<script src="js/engine.js"></script>
<script src="js/protocol.js"></script>
<script src="js/lobby.js"></script>
<script src="js/game.js"></script>
</body>
</html>
